# Test, build the static site and publish it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # prebuild copies the Pyodide runtime into public/, so the site needs no CDN.
      - name: Build
        run: npm run build

      # Leaderboard scores live on their own branch, written by the leaderboard workflow.
      - name: Add the leaderboard
        run: |
          if git fetch --depth 1 origin leaderboard; then
            git show FETCH_HEAD:leaderboard.json > dist/leaderboard.json
          else
            echo '{"entries":[]}' > dist/leaderboard.json
          fi

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
